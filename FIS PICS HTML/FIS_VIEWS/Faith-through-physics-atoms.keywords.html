<script>
const D=JSON.parse(document.getElementById('fis-folder-record').textContent);
const F=D.files||[],fo=D.folder||{};
const norm=k=>k.toLowerCase().replace(/[_\/]+/g,' ').replace(/\s+/g,' ').trim();
const idx=new Map();// norm -> {label, files:Set}
F.forEach((f,i)=>(f.keywords||[]).forEach(k=>{if(k.length<2)return;const n=norm(k);if(!idx.has(n))idx.set(n,{label:k,files:new Set()});idx.get(n).files.add(i)}));
const kws=[...idx.entries()].map(([n,v])=>({n,label:v.label,files:[...v.files]})).sort((a,b)=>b.files.length-a.files.length||a.n.localeCompare(b.n));
const shared=kws.filter(k=>k.files.length>1);
let sel=new Set(),sharedOnly=false,q='';
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.title='FIS Keywords | '+(fo.name||'');$('title').textContent=fo.name||'folder';$('path').textContent=fo.path||'';
const bytes=F.reduce((s,f)=>s+(f.size_bytes||0),0);
$('stats').innerHTML=[['Files',F.length],['Unique keywords',kws.length],['Shared',shared.length],['Bytes',bytes.toLocaleString()],['MEQ',fo.meq_aggregate||'—'],['Code',fo.compressed_name||'—']].map(([a,b])=>`<div class="stat"><b>${a}</b><code>${esc(b)}</code></div>`).join('');
$('kwcount').textContent=kws.length;
function render(){
 const max=kws[0]?kws[0].files.length:1;
 $('kws').innerHTML=kws.filter(k=>(!sharedOnly||k.files.length>1)&&(!q||k.n.includes(q))).map(k=>`<div class="kw ${k.files.length>1?'shared':''} ${sel.has(k.n)?'sel':''}" data-k="${esc(k.n)}"><span>${esc(k.label)}</span><span class="n">${k.files.length}</span><div class="meter" style="width:${k.files.length/max*100}%"></div></div>`).join('');
 $('unify').innerHTML=shared.map(k=>chip(k.n)).join('')||'<span class="muted">none</span>';
 const top=shared.slice(0,24);
 $('matrix').innerHTML='<tr><th class="l">file</th>'+top.map(k=>`<th title="${esc(k.label)}">${esc(k.label.slice(0,10))}</th>`).join('')+'</tr>'+F.map((f,i)=>'<tr><td class="l">'+esc(f.name)+'</td>'+top.map(k=>k.files.includes(i)?`<td class="h" style="background:var(--accent)">●</td>`:'<td></td>').join('')+'</tr>').join('');
 let shown=0;
 $('cards').innerHTML=F.map((f,i)=>{const ks=(f.keywords||[]).map(norm);const hit=[...sel].every(s=>ks.includes(s))&&(!q||(f.name+' '+ks.join(' ')).toLowerCase().includes(q));if(hit)shown++;
  return `<div class="card ${hit?'':'dim'}"><h3><a href="${esc(f.name)}">${esc(f.name)}</a></h3><div class="meta">${esc(f.type)} / ${esc(f.format)} · ${(f.size_bytes||0).toLocaleString()} B · ${esc(f.dominant_chi||'')} · conf ${f.confidence??'—'}</div><div class="meq">${esc(f.meq_name||'')}</div><div class="meta">${esc(f.internal_address||'')} · ${esc(f.content_role||'')} · ${esc(f.law_signal||'')}</div><div class="chips">${[...new Set(ks)].filter(k=>k.length>1).map(chip).join('')}</div></div>`}).join('');
 $('fcount').textContent=`(${shown} of ${F.length} match)`;
}
function chip(n){const k=idx.get(n);if(!k)return'';return `<span class="chip ${k.files.size>1?'shared':''} ${sel.has(n)?'sel':''}" data-k="${esc(n)}">${esc(k.label)}${k.files.size>1?' ·'+k.files.size:''}</span>`}
document.addEventListener('click',e=>{const t=e.target.closest('[data-k]');if(!t)return;const k=t.dataset.k;sel.has(k)?sel.delete(k):sel.add(k);render()});
$('q').oninput=e=>{q=e.target.value.toLowerCase().trim();render()};
$('sharedOnly').onclick=e=>{sharedOnly=!sharedOnly;e.target.classList.toggle('on',sharedOnly);render()};
$('clear').onclick=()=>{sel.clear();render()};
function aiPayload(){return{folder:fo.name,path:fo.path,meq:fo.meq_aggregate,file_count:F.length,unifying_keywords:shared.map(k=>({keyword:k.label,files:k.files.map(i=>F[i].name)})),files:F.map(f=>({name:f.name,type:f.type,dominant:f.dominant_chi,role:f.content_role,keywords:f.keywords}))}}
function toast(t){const el=$('toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',1500)}
$('copyAI').onclick=()=>{const p='Find the unifying themes across this Obsidian folder. Group files by shared concepts, name the clusters, and flag files that belong elsewhere.\n\n'+JSON.stringify(aiPayload(),null,1);navigator.clipboard.writeText(p).then(()=>toast('Copied prompt + data'))};
$('dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(aiPayload(),null,2)],{type:'application/json'}));a.download=(fo.name||'folder')+'.keywords.json';a.click()};
render();
</script></body></html>
