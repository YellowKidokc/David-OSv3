function aiPayload(){return{folder:fo.name,path:fo.path,meq:fo.meq_aggregate,file_count:F.length,unifying_keywords:shared.map(k=>({keyword:k.label,files:k.files.map(i=>F[i].name)})),files:F.map(f=>({name:f.name,type:f.type,dominant:f.dominant_chi,role:f.content_role,keywords:f.keywords}))}}
function toast(t){const el=$('toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',1500)}
$('copyAI').onclick=()=>{const p='Find the unifying themes across this Obsidian folder. Group files by shared concepts, name the clusters, and flag files that belong elsewhere.\n\n'+JSON.stringify(aiPayload(),null,1);navigator.clipboard.writeText(p).then(()=>toast('Copied prompt + data'))};
$('dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(aiPayload(),null,2)],{type:'application/json'}));a.download=(fo.name||'folder')+'.keywords.json';a.click()};
render();
</script></body></html>
