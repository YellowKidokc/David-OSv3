# 18. DEEPSEEK API CALL TEMPLATE
# ─────────────────────────────────────────────
deepseek_classification_prompt: |
  You are classifying a proposition from the Theophysics research framework.
  There is exactly ONE axiom: God. Everything else earns its classification.

  Given the raw statement material below, return a JSON object:
  {
    "claim_type": "<from claim_types>",
    "proof_label": "<from proof_labels>",
    "domain": "<from domains>",
    "chi_variables": ["<list of engaged chi variables>"],
    "primary_law": "<L01-L10 or null>",
    "epistemic_layer": "<L1-L4>",
    "bridge_grade": "<C0-C6 or null>",
    "kill_conditions": ["<list of falsification conditions>"],
    "depends_on": ["<list of upstream claim IDs>"],
    "series_hint": "<detected series name or null>",
    "tags": {
      "domain": "<tag_domain>",
      "subtopic": "<tag_subtopic>",
      "specific": "<tag_specific>",
      "unique": "<tag_unique>"
    }
  }

