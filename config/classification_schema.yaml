  BRIDGE_DECLARED: "Bridge claim made, labeled as such"
  LEAN_GUARDRAIL_SUPPORTED: "Lean 4 verification of structural property (not theological content)"
  LEAN_FULL_VERIFIED: "Lean 4 compilation with zero sorry/admit/axioms"
  PYTHON_RUNTIME_SUPPORTED: "Python computation confirms numerical claim"
  ABDUCTIVELY_FAVORED: "Best available explanation given evidence"
  NARRATIVE_ANCHOR: "Structural role in the argument, not independently provable"
  QUARANTINE: "Under review — may be overclaim or error"
  RERUN_OWED: "Previous verification outdated, needs re-run"
  RETIRED: "Withdrawn — superseded or falsified"


