# ─────────────────────────────────────────────
# 1. CLAIM CLASSIFICATION (one-axiom system)
# ─────────────────────────────────────────────
claim_types:
  AXIOM:
    description: "Admitted without derivation. Only A0 (God) gets this."
    can_be_proven: false
    example: "God is the self-existent ground of all reality"
  DEFINITION:
    description: "Fixes vocabulary. Neither true nor false. Stipulative."
    can_be_proven: false
    example: "Coherence C ∈ [0,1] measures alignment with ground"
  BOUNDARY:
    description: "Restricts domain or admissible states."
    can_be_proven: false
    example: "χ variables are non-negative and bounded"
  LEMMA:
    description: "Derived supporting proposition."
    can_be_proven: true
    example: "Distinction is the first act of a conscious ground"
  THEOREM:
    description: "Derived load-bearing proposition."
    can_be_proven: true
    example: "Coherence cannot self-increase (moral second law)"
  COROLLARY:
    description: "Direct consequence of a theorem."
    can_be_proven: true
    example: "Self-flip impossible (corollary of moral second law)"
  MODEL:
    description: "Mathematical representation with parameters. Testable."
    can_be_proven: false
    example: "dK/dt = -αχ(t) coupling model"
  HYPOTHESIS:
    description: "Proposed but untested claim."
    can_be_proven: false
    example: "Consciousness admits degrees proportional to Φ"
  PREDICTION:
    description: "Prospective testable consequence."
    can_be_proven: false
    example: "Synchronized structural breaks 1968-1973 across all domains"
  PROTOCOL:
    description: "Experimental or methodological procedure."
    can_be_proven: false
    example: "Isomorphic Event Density (IED) evaluation protocol"
  EVIDENCE:
    description: "Empirical or historical claim with data."
    can_be_proven: false
    example: "PEAR-LAB at 6.35σ, GCP at 6σ"
  BRIDGE:
    description: "Cross-domain structural mapping. Labeled, not promoted."
    can_be_proven: false
    grade_range: "C0-C6 / A-D"
    example: "Von Neumann chain ↔ Watcher closure (L2→L3 transport)"
  IDENTIFICATION:
    description: "Theological identification applied to a structural role."
    can_be_proven: false
    example: "Terminal observer = God (bridge claim)"
  OPEN:
    description: "Unresolved question. Honest gap."
    can_be_proven: false
    example: "How does mutual knowing become phenomenal consciousness?"
  CLOSURE:
    description: "Terminal claim about the system itself."
    can_be_proven: false
    example: "The framework is constraint-class (Noether), not electroweak-class"

