# ═══════════════════════════════════════════════════════════════
# DAVID-OS FOLDER REGISTRY — ground truth for the prediction engine
# ═══════════════════════════════════════════════════════════════
# The prediction engine (folder type: code / documents / pictures / video /
# mixed / needs-sorting, plus domain) checks this file FIRST. A folder listed
# here with confirmed: true is never guessed — its answer is used as-is and
# also becomes a training label for folders that are NOT listed.
#
# Answers the onboarding flow in config/rules/onboarding_questions.v1.json.
# Roles come from config/rules/folder_profiles.28pof.v1.json.
#
# confirmed: false  = Claude's guess from folder names only (2026-09-16). Fix me.
# confirmed: true   = David said so.
#
# Fields
#   role:       intake_hub | active_surface | review_first_library | media_library |
#               canonical_destination | research_corpus | program_root |
#               ai_output_inbox | publish_staging | retention_library |
#               safety_buffer | protected_sync_library | system
#   kind:       code | documents | pictures | video | audio | data | mixed | needs_sorting
#   domain:     theophysics | trading | ai_chats | website | infrastructure | personal | business | other
#   importance: critical | high | normal | low | junk
#   canon:      none | some | canonical        (canonical = everything inside is canon)
#   protect:    true → never move/rename/flatten inside (project roots, boot, system)
#   automation: report_only | suggest_actions | approval_required | allow_safe_rules
# ═══════════════════════════════════════════════════════════════

