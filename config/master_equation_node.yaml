    direction: ""     # A→B, B→A, or A↔B
    preserved:
      nodes: []
      edges: []
      operations: []
      constraints: []
      ordering: []
    lost:
      nodes: []
      edges: []
      operations: []
    introduced: []    # structure in target not present in source
    forbidden: []     # mappings explicitly ruled out
    natural_mirror:
      question: "What human-independent process exhibits this same structural relationship?"
      process: ""
      human_independent: null
      failure_condition: ""
    bridge_grade: ""  # B0-B5 from expansion rules
    lean_status: ""
    lean_file: ""
    rival_mappings:
      - description: ""
        defeated_by: ""
    kill_conditions: []
    display:
      tile_label: ""
      grade_display: ""  # "Compiled Transport" not "C5"
      color: ""

  # ─── API MIRROR SEARCH QUESTION ───────────
  # This is the question DeepSeek asks for every
  # claim, variable, or bridge:
  mirror_search_prompt: |
    For the following claim or structural relationship, answer:

    1. NATURAL MIRROR: What process in the physical world has the
       same relational structure? Name the specific process, not
       a category.

    2. HUMAN INDEPENDENCE: Would this process continue to exist
       and exhibit this structure if all humans disappeared?

    3. PRESERVED STRUCTURE: What specific relation, operation,
       ordering, or constraint is the same in both?

    4. FAILURE CONDITION: What observation would break this
       correspondence?

    5. RIVAL MAPPING: Is there another natural process that fits
       equally well? If so, name it and say why the proposed
       mirror is preferred.

    Return JSON:
    {
      "natural_process": "",
      "human_independent": true/false,
      "preserved_structure": [],
      "failure_condition": "",
      "rival_process": "",
      "rival_defeated_by": "",
      "confidence": 0-10
    }

