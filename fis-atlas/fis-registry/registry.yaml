# FIS shared codebook — readable source of truth. Compiled to SQLite for lookup.
# RULES: never reuse a code · version the registry · supersede, never overwrite ·
#        hash every manifest · every code decompressible · chain is verifiable.
registry_version: FIS-LEXICON-2

registry:
  version: 17
  registry_id: FISREG-0017
  previous_version: FISREG-0016
  previous_hash: null          # genesis-adjacent; sealed chains fill this
  content_hash: null           # set by Registry.seal()
  created_at: 2026-08-13T14:20:00Z

operations:
  L: scan
  I: identify_and_hash
  U: classify
  S: compare_and_cluster
  C: copy
  M: move
  R: rename
  A: archive
  Q: quarantine
  D: deduplicate_in_collection
  V: verify
  G: generate_report

roots:
  "01": C:/Research
  "02": D:/Old Research
  "03": O:/Theophysics
  "04": //192.168.2.50/h_hp/Desktop
  "05": O:/GTQ_AGGREGATE

paths:
  Q1: O:/GTQ_AGGREGATE
  Q2: O:/GTQ_AGGREGATE/01_GENESIS
  Q3: O:/GTQ_AGGREGATE/02_PHYSICS
  Q4: O:/GTQ_AGGREGATE/03_QUANTUM
  Q5: O:/GTQ_AGGREGATE/_REVIEW

strategies:
  "01": flat
  "02": by_extension
  "03": semantic_categories
  "04": series_then_format
  "05": preserve_existing_structure

policies:
  "01": observe_only
  "02": copy_preserve_originals
  "03": move_after_approval
  "04": exact_dedupe_inside_aggregate
  "05": archive_after_approval
  "06": protected_research_corpus

results:
  "00": proposed
  "01": approved
  "02": partially_completed
  "03": completed_and_verified
  "04": blocked
  "05": rolled_back

periods:
  T7: 2026-08-13

workflows:
  W7:
    name: Verified corpus aggregation
    sequence: [L, I, U, D, C, V, G]
    organization: "04"
  W9:
    name: Cross-format visual slide recovery
    sequence: [L, I, S, D, C, V]      # scan -> phash -> cluster -> propose -> copy -> verify
    match_method: perceptual_hash_then_confirm
    scope: {images: [D, H, Z], documents_pdf: [H]}
    output: {matched: Matched, unmatched: Unmatched, ambiguous: Review}
    naming: family_projection          # A011-01P.pdf / -01N.png / -01W.webp
    ruling: D22
    policy: "02"                        # copy, preserve originals

paths_ext:
  MATCHED: H:/Recovered_Slides/Matched

decisions:
  D14:
    question: Which format normally governs?
    ruling:
      editable_source: .md
      derivatives: [.html, .pdf, .docx]
    scope: Genesis to Quantum
    ruled_by: David Lowe
  D22:
    question: In a pdf->png->webp slide chain, which representation is the source?
    ruling:
      source: .pdf
      render: .png
      derivative: .webp
    scope: slide_exports
    ruled_by: David Lowe
    supersedes: null

# root-set = WHERE to search (immutable; changed membership -> new code, never edit)
root_sets:
  RS04:
    name: GTQ search roots
    count: 4
    members:
      - { root_id: R01, volume_id: VOL-8A27, path: D:/Research }
      - { root_id: R02, volume_id: VOL-142C, path: O:/Theophysics }
      - { root_id: R03, volume_id: NAS-50,   path: //192.168.2.50/h_hp/Desktop }
      - { root_id: R04, volume_id: VOL-62F9, path: C:/GTQ }
    manifest_hash: "seed-unhashed"   # replace with blake2b of the manifest file

# object-set = WHICH objects were selected
object_sets:
  OS91:
    name: GTQ confirmed 200
    object_count: 200
    membership_manifest: manifests/OS91.fism
    membership_rule: GTQ-RULE-04
    manifest_hash: "seed-unhashed"

# a batch ties a root-set + object-set + destination + workflow + policy + ruling
batches:
  B442:
    root_set: RS04
    selected_object_set: OS91
    destination: Q1
    workflow: W7
    policy: "02"
    ruling: D14

superseded: {}   # e.g. P03: {status: superseded, replaced_by: P11}
