[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fis-standalone"
version = "0.1.0"
description = "Offline, approval-bound folder intelligence"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fis = "fis.cli:main"

[tool.setuptools]
packages = ["fis", "fis.preference"]
package-dir = {fis = ".", "fis.preference" = "preference"}

[tool.setuptools.package-data]
fis = ["data/*.json", "data/*.md", "static/*"]
