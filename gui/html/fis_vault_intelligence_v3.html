    edges.forEach((e,i)=>{const a=2*Math.PI*i/Math.max(edges.length,1);const x=cx+Math.cos(a)*250,y=cy+Math.sin(a)*140;
      parts+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${relColors[e.relation]||"#555"}" stroke-width="1.5" stroke-dasharray="${e.relation==="contradicts"?"5 3":"none"}"/>
      <circle class="node" cx="${x}" cy="${y}" r="16" fill="#0c0f14" stroke="${relColors[e.relation]||"#555"}"/>
      <text x="${x}" y="${y+30}" text-anchor="middle" style="fill:#e7edf5;font-size:11px">${esc((byId[e.target].title||e.target).slice(0,26))}</text>
      <text x="${(cx+x)/2}" y="${(cy+y)/2-5}" text-anchor="middle">${e.relation}</text>`;});
    svg=`<svg width="${W}" height="${H}" style="background:var(--panel2);border:1px solid var(--line)">
      <circle class="node" cx="${cx}" cy="${cy}" r="24" fill="#1a3a5c" stroke="#d1a922"/><text x="${cx}" y="${cy+4}" text-anchor="middle" style="fill:#fff;font-size:11px">${c.tot}/${c.ceil}</text>
      <text x="${cx}" y="${cy-34}" text-anchor="middle" style="fill:#f1d37a;font-size:12px">${esc(p.title.slice(0,30))}</text>${parts}</svg>`;}
  $("#view").innerHTML=`<h2>Dependency & contradiction graph — what dies if this falls</h2>
  <p><select id="gsel" onchange="graphSel=this.value;vGraph()">${opts}</select> <span class="muted">gold=depends_on · green=supports · red dashed=contradicts · blue=refines · purple=tests</span></p>${svg}
  <p class="muted">Blast radius: walk depends_on transitively. A GATED paper with downstream dependents is a structural fire.</p>`;}
/* ============ PAPER MODAL ============ */
function openPaper(id){const p=byId[id];if(!p)return;const c=compute(p);
  const srows=SIDS.map(sid=>{const s=p.sections[sid],n=net(s);return `<tr><td class="muted">${sid.toUpperCase()}</td><td>${SECTION_NAMES[sid]}</td><td class="pos">${s.pos||""}</td><td class="neg">${s.neg||""}</td><td><b>${n}</b>${n>=8&&((c.lb&&["s02","s03","s04","s07"].includes(sid))||(c.hon&&["s05","s06","s08","s09"].includes(sid)))?" ⬈15":""}</td><td style="font-size:11px">${(s.rules||[]).map(r=>`<span class="badge">${r}</span>`).join("")}</td></tr>`}).join("");
  const chi=CHI_ORDER.map(k=>{const v=(p.chi||{})[k]||0;return `<td style="text-align:center"><b style="color:${v>=3?"var(--accent2)":v>=1?"var(--text)":"var(--muted)"}">${v||"·"}</b><br><span class="muted" style="font-size:9px">${CHI_NAMES[k]}</span></td>`}).join("");
  const blk=(t,arr,cols)=>arr&&arr.length?`<h2>${t}</h2><table>${arr.map(r=>`<tr>${cols.map(cf=>`<td>${esc(cf(r))}</td>`).join("")}</tr>`).join("")}</table>`:"";
  $("#modalbody").innerHTML=`<div class="eyebrow">${esc(p.lossless_address||"")} · ${esc(p.sha256||"").slice(0,16)}…</div>
  <h1 style="font-size:24px">${esc(p.title)}</h1>
  <p><span class="badge ${clsBadge(c.cls)}">${c.cls}</span> <b>${c.tot}/${c.ceil}</b> <span class="muted">(chains LB ${c.lb?"✓":"✗"} · HON ${c.hon?"✓":"✗"}${c.integrity?" · +5 integrity":""})</span>
  ${c.gated?' <span class="badge gated">GATED</span>':''} · rating ${p.paper_rating>0?"+"+p.paper_rating:p.paper_rating}/${esc(p.rating_awarded_by)}</p>
  <p class="muted">Build next: ${esc(p.build_next||"—")} · path: ${esc(p.path||"—")}</p>
  <h2>χ-vector</h2><table><tr>${chi}</tr></table>
  <h2>Section scores</h2><table class="sect"><tr><th>§</th><th>Section</th><th>Pos</th><th>Neg</th><th>Net</th><th>Rules fired</th></tr>${srows}</table>
  ${blk("Bridges",p.bridges,[r=>r.id,r=>r.src+" → "+r.tgt,r=>r.type,r=>"LOST: "+r.lost,r=>"word-gate: "+r.word_gate,r=>r.grade])}
  ${blk("Falsifiers",p.falsifiers,[r=>r.id,r=>r.claim,r=>r.kill,r=>r.status])}
  ${blk("Predictions",p.predictions,[r=>r.id,r=>r.prediction,r=>r.deadline,r=>r.outcome])}
  ${blk("Edges",p.edges,[r=>r.relation,r=>r.target])}`;
  $("#modal").style.display="block";}
/* ============ WIRE UP ============ */
function showTab(t){tab=t;document.querySelectorAll("button.tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));
  ({overview:vOverview,fires:vFires,shelves:vShelves,graph:vGraph})[t]();$("#count").textContent=`${DATA.length} papers · index ${DATA===SAMPLE?"SAMPLE":"LOADED"}`;}
document.querySelectorAll("button.tab").forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
$("#q").oninput=()=>showTab(tab);
$("#loadbtn").onclick=()=>$("#file").click();
$("#file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.papers)throw 0;DATA=j.papers;reindex();$("#datasrc").innerHTML=`index.json — <b>${esc(j.source||"")}</b> · generated ${esc(j.generated_at||"")}`;shelf=null;graphSel=null;showTab(tab);}catch(x){alert("Not a valid index.json (need a .papers array)");}};r.readAsText(f);};
function sortBy(){} // scores pre-sorted weakest-first; placeholder for future column sorts
showTab("overview");
</script></body></html>
