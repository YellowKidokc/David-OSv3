[package]
name = "fis-kernel"
version = "0.1.0"
edition = "2024"
description = "Read-only, receipt-first filesystem intelligence kernel"
license = "MIT"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
